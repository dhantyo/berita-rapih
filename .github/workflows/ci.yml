name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:autoallpage
      - run: npm run import:adblock
      - run: npm run typecheck
      - run: npm test
      # Where the reader's feedback goes (a Google Form's prefilled link, posted to directly). A repository variable
      # (Settings → Secrets and variables → Actions → Variables), so it can point at a form that needs no
      # GitHub account; unset = the GitHub "Broken article" form. See docs/DEVELOPING.md.
      - run: npm run build
        env:
          SAPU_REPORT_URL: ${{ vars.SAPU_REPORT_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            dist/
            apps/extension/
      # Hand the generated WebView script + domain list to the Android job.
      - uses: actions/upload-artifact@v7
        with:
          name: android-assets
          path: apps/android/app/src/main/assets/

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-assets
          path: apps/android/app/src/main/assets/
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Every published APK must be signed with the same key, or phones refuse the update.
      # Without the secret (forks, pull requests) the build falls back to a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAPU_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SAPU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release tags need the SAPU_KEYSTORE_B64 secret (see apps/android/README.md)." && exit 1
          fi
      # The runner image ships the Android SDK (ANDROID_HOME); the wrapper fetches Gradle.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/android
        env:
          SAPU_KEYSTORE_PASSWORD: ${{ secrets.SAPU_KEYSTORE_PASSWORD }}
          SAPU_KEY_ALIAS: ${{ secrets.SAPU_KEY_ALIAS }}
          SAPU_KEY_PASSWORD: ${{ secrets.SAPU_KEY_PASSWORD }}
      - run: mv apps/android/app/build/outputs/apk/release/app-release.apk sapu-berita.apk
      - uses: actions/upload-artifact@v7
        with:
          name: sapu-berita-android-apk
          path: sapu-berita.apk

  # Pushing a tag like v0.1.0-beta.1 publishes a GitHub Release with the APK, the extension and the Shortcut script.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: builds/
      - uses: actions/download-artifact@v8
        with:
          name: sapu-berita-android-apk
          path: apk/
      - name: Package
        env:
          SAPU_REPORT_URL: ${{ vars.SAPU_REPORT_URL }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$V" = "$(node -p "require('./package.json').version")" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          mkdir out
          cp apk/sapu-berita.apk "out/sapu-berita-$V.apk"
          # Extension: one zip for Load unpacked, the Chrome Web Store and Edge Add-ons; one for addons.mozilla.org,
          # plus the source AMO asks for (content.js is bundled; build with `npm ci && npm run build`).
          (cd builds/apps/extension && zip -q "$GITHUB_WORKSPACE/out/sapu-berita-extension-$V.zip" manifest.json content.js icons/*.png)
          (cd builds/dist/extension-firefox && zip -q "$GITHUB_WORKSPACE/out/sapu-berita-firefox-$V.zip" manifest.json content.js icons/*.png)
          git archive --format=zip -o "out/sapu-berita-source-$V.zip" HEAD
          cp builds/dist/shortcut.b64.js "out/sapu-berita-shortcut-$V.js"
          # Release channel, served by GitHub Pages: installed copies check update.json once a day
          # and pick up rules.json (site fixes) without reinstalling.
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          mkdir channel
          cp builds/dist/rules.json channel/rules.json
          # Apple: the Shortcut and the Safari bookmark download this core on every run (always the latest).
          cp builds/dist/shortcut.js channel/sapu-berita.js
          cp builds/dist/apple-loader.js builds/dist/bookmarklet.txt channel/
          # Install page.
          cp -r site/. channel/
          mkdir -p channel/img && cp docs/img/phone-light.png docs/img/phone-dark.png channel/img/
          # Fonts: Aa → Serif / Jelas download these on demand; the install page uses Geist.
          mkdir -p channel/fonts && cp fonts/*.woff2 fonts/OFL-*.txt channel/fonts/
          cat > channel/update.json <<JSON
          {
            "version": "$V",
            "notes": "$REPO_URL/releases/tag/v$V",
            "android": "$REPO_URL/releases/download/v$V/sapu-berita-$V.apk",
            "extension": "$REPO_URL/releases/tag/v$V",
            "apple": "$REPO_URL/blob/master/docs/install-apple.md"
          }
          JSON
          # Installed copies read the feedback form from here too (`form`; 0.6 and older read `report` and keep their
          # built-in link when it's missing), so changing the form needs no app update.
          if [ -n "$SAPU_REPORT_URL" ]; then
            node -e "const fs=require('fs'),f='channel/update.json',m=JSON.parse(fs.readFileSync(f,'utf8'));m.form=process.env.SAPU_REPORT_URL;fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
          fi
          node -e "JSON.parse(require('fs').readFileSync('channel/update.json','utf8'))"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v h="## [$V]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG.md section for $V"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; [[ "$V" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" out/* --title "Sapu Berita $V" --notes-file notes.md $PRE
      - uses: actions/upload-pages-artifact@v5
        with:
          path: channel/

  # Submit the release's extension zips to the three stores (docs/STORES.md, "Automatic store uploads"). Each store
  # skips itself until its secrets exist; pre-releases (v1.2.3-beta.1) never go to the stores. A store still reviewing
  # the previous version may refuse the upload; daily releases make that common, and the next release catches up, so
  # a refusal is a warning on the run (read by the daily maintenance run), not a failure that emails.
  stores:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: zips
        name: Download the release zips
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p "sapu-berita-extension-$V.zip" -p "sapu-berita-firefox-$V.zip" -p "sapu-berita-source-$V.zip"
          mkdir firefox && unzip -q "sapu-berita-firefox-$V.zip" -d firefox
          echo "V=$V" >> "$GITHUB_ENV"
      - id: chrome
        name: Chrome Web Store
        continue-on-error: true
        if: ${{ steps.zips.outcome == 'success' && env.CWS_REFRESH_TOKEN != '' }}
        run: npx -y chrome-webstore-upload-cli@4.0.2 --source "sapu-berita-extension-$V.zip"
        env:
          EXTENSION_ID: cnpcdeijcckcobfngmglmdfgfcdlnglc
          CLIENT_ID: ${{ env.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ env.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ env.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ env.CWS_PUBLISHER_ID }}
      # Listed channel: AMO signs it and lists it after review. Only the version's own fields are sent (build notes
      # for the reviewer); the listing text stays as it is on AMO. Doesn't wait for approval.
      - id: firefox
        name: Firefox Add-ons
        continue-on-error: true
        if: ${{ steps.zips.outcome == 'success' && env.AMO_API_SECRET != '' }}
        run: |
          cat > amo.json <<'JSON'
          { "version": { "approval_notes": "Node 22. `npm ci && npm run build`; the add-on is `dist/extension-firefox/`. content.js is an esbuild bundle (not minified) of src/entries/extension.ts. The innerHTML warnings come from bundled libraries: @mozilla/readability, DOMPurify and PhotoSwipe." } }
          JSON
          npx -y web-ext@10.8.0 sign --source-dir firefox --artifacts-dir amo-out --channel listed \
            --upload-source-code "sapu-berita-source-$V.zip" --amo-metadata amo.json --approval-timeout 0 \
            --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET"
      # Edge's API key expires every 72 days; Partner Center emails before it does (renewing: docs/STORES.md).
      - id: edge
        name: Edge Add-ons
        continue-on-error: true
        if: ${{ steps.zips.outcome == 'success' && env.EDGE_API_KEY != '' }}
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: 52c939f3-79ef-4a25-b7cd-d309ecd843b9
          zip-path: sapu-berita-extension-${{ env.V }}.zip
          client-id: ${{ env.EDGE_CLIENT_ID }}
          api-key: ${{ env.EDGE_API_KEY }}
      - name: Report
        if: always()
        run: |
          for r in "Chrome Web Store=${{ steps.chrome.outcome }}" "Firefox Add-ons=${{ steps.firefox.outcome }}" "Edge Add-ons=${{ steps.edge.outcome }}"; do
            echo "- ${r%%=*}: ${r#*=}" >> "$GITHUB_STEP_SUMMARY"
            [ "${r#*=}" = failure ] && echo "::warning::${r%%=*} refused $GITHUB_REF_NAME (still reviewing the previous version, or an expired key; see the step log)"
          done
          true

  # Publish the release channel. Needs GitHub Pages enabled with "GitHub Actions" as the source.
  channel:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5
